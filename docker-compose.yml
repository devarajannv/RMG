version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rmgaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmgaas
      POSTGRES_PASSWORD: rmgaas_dev
      POSTGRES_DB: rmgaas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rmgaas -d rmgaas']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rmgaas-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server (development mode with hot reload)
  api:
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
      target: development
    container_name: rmgaas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://rmgaas:rmgaas_dev@postgres:5432/rmgaas?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-jwt-secret-change-in-production-32chars
      COOKIE_SECRET: development-cookie-secret-change-in-prod-32char
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/api/node_modules

  # Frontend (development mode with hot reload)
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend.Dockerfile
      target: development
    container_name: rmgaas-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/frontend/node_modules

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge


