apiVersion: v1
kind: Service
metadata:
  name: rmgaas-redis
  namespace: rmgaas
  labels:
    app.kubernetes.io/name: rmgaas
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rmgaas
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
