# Kubernetes Secrets Template
# NOTE: In production, use external secret management (e.g., AWS Secrets Manager, HashiCorp Vault)
# This file is for reference only - DO NOT commit actual secrets

apiVersion: v1
kind: Secret
metadata:
  name: rmgaas-secrets
  namespace: rmgaas
  labels:
    app.kubernetes.io/name: rmgaas
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials
  # Replace with actual values or use external secrets
  DATABASE_URL: "postgresql://user:password@rmgaas-postgres:5432/rmgaas?schema=public"
  
  # Redis URL
  REDIS_URL: "redis://rmgaas-redis:6379"
  
  # JWT Configuration
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  JWT_EXPIRES_IN: "24h"
  JWT_REFRESH_EXPIRES_IN: "7d"
  
  # Session Secret
  SESSION_SECRET: "your-session-secret-change-in-production"
  
  # API Keys (if using external services)
  # OPENAI_API_KEY: ""
  # SMTP_PASSWORD: ""
  
---
