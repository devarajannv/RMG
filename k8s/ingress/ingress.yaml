apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rmgaas-ingress
  namespace: rmgaas
  labels:
    app.kubernetes.io/name: rmgaas
    app.kubernetes.io/component: ingress
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # cert-manager for automatic TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rmgaas.example.com
        - api.rmgaas.example.com
      secretName: rmgaas-tls
  rules:
    # Frontend
    - host: rmgaas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rmgaas-frontend
                port:
                  number: 80
    # API
    - host: api.rmgaas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rmgaas-api
                port:
                  number: 4000
---
# Alternative: Single domain with path-based routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rmgaas-ingress-path-based
  namespace: rmgaas
  labels:
    app.kubernetes.io/name: rmgaas
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rmgaas.example.com
      secretName: rmgaas-tls
  rules:
    - host: rmgaas.example.com
      http:
        paths:
          # API routes
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rmgaas-api
                port:
                  number: 4000
          # GraphQL routes
          - path: /graphql(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rmgaas-api
                port:
                  number: 4000
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rmgaas-frontend
                port:
                  number: 80
