apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rmgaas-postgres
  namespace: rmgaas
  labels:
    app.kubernetes.io/name: rmgaas
    app.kubernetes.io/component: database
spec:
  serviceName: rmgaas-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rmgaas
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rmgaas
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: rmgaas
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rmgaas-postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmgaas-postgres-secrets
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: rmgaas
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: standard
---
apiVersion: v1
kind: Secret
metadata:
  name: rmgaas-postgres-secrets
  namespace: rmgaas
  labels:
    app.kubernetes.io/name: rmgaas
    app.kubernetes.io/component: database
type: Opaque
stringData:
  username: rmgaas
  password: change-this-password-in-production
